{% set data = load_setup_py_data() %}

package:
    name: yokai
    version: {{ data["version"] }}

about:
    home: {{ data["url"] }}
    summary: {{ data["description"] }}

source:
    path: ..

build:
    noarch: python
    script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
    host:
        - python >=3.9
        - pip
        - setuptools
    run:
        - python >=3.9
        - ipython
        - logzero
        - openai
        - rich

test:
    imports:
        - yokai


